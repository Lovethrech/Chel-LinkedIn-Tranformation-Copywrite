kind = "web"
previewPath = "/"
title = "LinkedIn Transformation Case Study"
description = "A polished single-page portfolio case study showing how strategic copywriting can transform an executive coaching LinkedIn profile into a clearer, more credible inquiry path."
version = "1.0.0"
id = "artifacts/linkedin-transformation-case-study"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20448

[services.development]
run = "pnpm --filter @workspace/linkedin-transformation-case-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/linkedin-transformation-case-study", "run", "build" ]
serve = "static"
publicDir = "artifacts/linkedin-transformation-case-study/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20448"
BASE_PATH = "/"
